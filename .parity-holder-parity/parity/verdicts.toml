# Film verdicts: what the handlers actually do, with file:line evidence.
# A registered command id is a claim, not a fact; "read" rows cite handler bodies that
# were read, "wired" rows are registered-and-documented but the body was not read.

[verdict."three-point-editing"]
title = "Three-point editing (insert / overwrite from Source Monitor)"
verdict = "REAL"
level = "read"
evidence = ["crates/engine/src/commands.rs:1562", "crates/engine/src/commands.rs:3305"]
